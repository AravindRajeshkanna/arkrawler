name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    lint-and-test:
        name: Lint & unit tests (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: ['22.x', '24.x', 'current']
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Check formatting
              run: npm run format:check

            - name: Unit tests
              run: npm test

    integration-test:
        name: Integration test (crawler + Redis)
        runs-on: ubuntu-latest
        services:
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.x'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Integration tests
              run: npm run test:integration
              env:
                  REDIS_URL: redis://127.0.0.1:6379

    coverage:
        name: Coverage report
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.x'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Unit tests with coverage
              run: npm run test:coverage
